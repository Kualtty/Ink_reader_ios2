name: 编译未签名 ipa

# 没有 Mac 也能拿到安装包：
# 仓库 → Actions → 左侧选「编译未签名 ipa」→ 右侧 Run workflow。
# 编好的 ipa 会出现在那次运行的 Artifacts 里，下载到电脑上用 Sideloadly
# 之类的工具拿 Apple ID 签名后装到 iPad（免费签名 7 天过期）。

on:
  workflow_dispatch:          # 允许手动触发（Actions 页面出现 Run workflow 按钮）
  push:
    tags: ['v*']              # 打 v1.0 这样的 tag 也会自动跑

jobs:
  build:
    runs-on: macos-14           # GitHub 托管的 macOS 编译机，公开仓库免费
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 打印环境（出问题时先看这里）
        run: |
          xcodebuild -version
          xcode-select -p
          python3 --version

      - name: 静态自检（文件是否漏登记 / 括号配平）
        run: python3 tools/check_sources.py

      - name: 解析 SPM 依赖（ZIPFoundation）
        run: |
          xcodebuild \
            -project InkReader.xcodeproj \
            -scheme InkReader \
            -resolvePackageDependencies

      - name: 编译（关闭签名，只要产物）
        run: |
          set -o pipefail
          xcodebuild \
            -project InkReader.xcodeproj \
            -scheme InkReader \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -n 80

      - name: 确认 .app 出来了
        run: |
          ls -la build/Build/Products/Release-iphoneos/
          test -d build/Build/Products/Release-iphoneos/InkReader.app

      - name: 打成 ipa
        run: |
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R InkReader.app Payload/
          zip -qry "$GITHUB_WORKSPACE/InkReader-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh InkReader-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: InkReader-unsigned-ipa
          path: InkReader-unsigned.ipa
          retention-days: 30
